name: Check iPhone Duo stock

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; runs can be delayed under load
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MENTION: ${{ github.repository_owner }}
        run: python3 checker.py ${{ inputs.test_notify && '--test-notify' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key state- --limit 100 --json id,key \
            --jq '.[] | select(.key != "state-${{ github.run_id }}-${{ github.run_attempt }}") | .id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
