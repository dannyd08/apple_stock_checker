name: Check iPhone Duo stock

on:
  schedule:
    - cron: "2-57/5 * * * *"  # every 5 min (GitHub's minimum), off the busy :00
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification"
        type: boolean
        default: false

# GitHub's scheduler can't fire more often than every 5 minutes, and fires are
# best-effort (often late, sometimes dropped), so each scheduled run loops instead: a
# check every CHECK_EVERY seconds, for RUN_FOR seconds. RUN_FOR is much longer than the
# gap between fires on purpose: with the concurrency group below, the next fire waits
# as "pending" until the current run ends, so coverage holds as long as any one of the
# ~5 fires during a run arrives. Each new fire replaces the pending one, which shows up
# as a cancelled run; that's expected. Manual runs ("Run workflow") do one check.
env:
  CHECK_EVERY: "180"
  RUN_FOR: "1680"
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read
  issues: write
  actions: write

# Scheduled runs queue behind each other; manual runs get their own group so a test
# doesn't wait up to an hour for the loop to finish.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'stock-check' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MENTION: ${{ github.repository_owner }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$CHECK_EVERY" ]; then
            args="--every $CHECK_EVERY --for $RUN_FOR"
          fi
          [ "${{ inputs.test_notify }}" = "true" ] && args="$args --test-notify"
          python3 checker.py $args

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # Keep the 3 newest so two runs finishing together can't delete each other's.
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key state- --limit 100 \
            --sort created_at --order desc --json id --jq '.[3:][].id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
