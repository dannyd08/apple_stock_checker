name: Check iPhone Duo stock

on:
  schedule:
    - cron: "2-57/5 * * * *"  # every 5 min (GitHub's minimum), off the busy :00
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification"
        type: boolean
        default: false
      loop:
        description: "Keep checking for RUN_FOR seconds (and queue the next run)"
        type: boolean
        default: false

# How continuous checking works. A "loop run" (any scheduled run, or a manual run with
# the loop box ticked) checks every CHECK_EVERY seconds for RUN_FOR seconds, and as its
# first step queues its own successor with workflow_dispatch. The concurrency group
# below holds that successor as "pending" until the current run ends, so the chain
# never has a gap. GitHub's scheduler is only a backup that restarts the chain if a run
# ever dies before queueing the next: its fires are best-effort (often late, sometimes
# dropped, hours late for new repos). Each fire replaces the pending run, which shows
# up as a cancelled run in the Actions tab; that's expected. To stop everything,
# disable the workflow (Actions → Check iPhone Duo stock → ··· → Disable workflow).
# A manual run without the loop box does one check and doesn't touch the chain.
env:
  CHECK_EVERY: "180"
  RUN_FOR: "1680"
  LOOP: ${{ github.event_name == 'schedule' || inputs.loop == true }}
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read
  issues: write
  actions: write

# Loop runs queue behind each other (one running, one pending); single checks get
# their own group so a test doesn't wait for the loop to finish.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.loop == true) && 'stock-check' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Queue the next loop run
        if: env.LOOP == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f loop=true

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MENTION: ${{ github.repository_owner }}
        run: |
          args=""
          if [ "$LOOP" = "true" ]; then
            args="--every $CHECK_EVERY --for $RUN_FOR"
          fi
          [ "${{ inputs.test_notify }}" = "true" ] && args="$args --test-notify"
          python3 checker.py $args

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # Keep the 3 newest so two runs finishing together can't delete each other's.
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key state- --limit 100 \
            --sort created_at --order desc --json id --jq '.[3:][].id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
