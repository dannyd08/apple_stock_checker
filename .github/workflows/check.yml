name: Check iPhone Duo stock

on:
  schedule:
    - cron: "7 * * * *"  # hourly; each run then loops for ~58 minutes (see env below)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification"
        type: boolean
        default: false

# GitHub's scheduler can't fire more often than every 5 minutes, so each scheduled run
# loops instead: a check every CHECK_EVERY seconds, for RUN_FOR seconds. Manual runs
# ("Run workflow") do a single check. For one check per scheduled run, empty both and
# set the cron to "*/5 * * * *".
env:
  CHECK_EVERY: "180"
  RUN_FOR: "3480"
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read
  issues: write
  actions: write

# Scheduled runs queue behind each other; manual runs get their own group so a test
# doesn't wait up to an hour for the loop to finish.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'stock-check' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_MENTION: ${{ github.repository_owner }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$CHECK_EVERY" ]; then
            args="--every $CHECK_EVERY --for $RUN_FOR"
          fi
          [ "${{ inputs.test_notify }}" = "true" ] && args="$args --test-notify"
          python3 checker.py $args

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key state- --limit 100 --json id,key \
            --jq '.[] | select(.key != "state-${{ github.run_id }}-${{ github.run_attempt }}") | .id' |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
